<!doctype html>
<html lang="en" class="anim">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <title>Orbit — Secure system</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Syncopate:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #ffffff;
      --surface: #161616;
      --orb-reveal: cubic-bezier(.16, 1, .3, 1);
      --orb-soft: cubic-bezier(.25, .8, .28, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: var(--surface);
      font-family: "Space Grotesk", "Orbit Sans", Arial, Helvetica, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { text-decoration: none; color: inherit; }
    ul { list-style: none; margin: 0; padding: 0; }

    main.viewport {
      position: fixed;
      inset: 0;
      background: var(--surface);
    }

    section.stage {
      position: absolute;
      inset: 0;
      contain: strict;
      isolation: isolate;
    }

    /* 1. Brand Mark */
    .brand-mark {
      position: absolute;
      top: 2.141745dvh;
      left: 3.854167vw;
      width: clamp(34px, min(3.4375vw, 5.2dvh), 66px);
      z-index: 4;
    }

    /* 2. Primary Nav */
    .primary-nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .primary-nav li {
      position: absolute;
      top: 3.426791dvh;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      pointer-events: auto;
    }

    .nav-home { left: 10.104167vw; transform: scaleX(1.165); }
    .nav-resources { left: 17.526042vw; transform: scaleX(1.052); }
    .nav-benefits { left: 27.578125vw; transform: scaleX(1.126); }
    .nav-contact { left: 36.171875vw; transform: scaleX(1.168); }

    /* 3. Secure Pill */
    .secure-pill {
      position: absolute;
      top: 2.336449dvh;
      right: 7.5vw;
      height: clamp(34px, 4.439252dvh, 57px);
      background: var(--ink);
      color: var(--surface);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 1.5em;
      font-size: clamp(13px, min(1.302083vw, 2.05dvh), 25px);
      letter-spacing: 0.026923em;
      z-index: 4;
      pointer-events: auto;
    }

    /* 4. Wordmark ORBIT */
    .orbit-word {
      position: absolute;
      top: 11.565421dvh;
      left: 4.348958vw;
      font-family: "Syncopate", "Orbit Display", "Times New Roman", Times, serif;
      font-size: min(27.8125vw, 55dvh);
      letter-spacing: 0.033708em;
      line-height: 1;
      margin: 0;
      z-index: 1;
    }

    .orbit-word__mask {
      display: block;
      overflow: hidden;
      padding-top: 0.1em;
      margin-top: -0.1em;
    }

    .orbit-word__inner {
      display: block;
    }

    .orbit-word__white {
      color: var(--ink);
    }

    .orbit-word__o {
      display: inline-block;
      transform: scaleX(1.0866);
      margin-right: 0.042135em;
    }

    .orbit-word__pink {
      background: linear-gradient(180deg, #ffc5dc 0%, #fd86db 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 5. Flower / Brain Stack */
    .flower {
      position: absolute;
      top: 14.749065dvh;
      left: 49.121328vw;
      height: 106.109034dvh;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
    }

    .flower__sizer {
      height: 100%;
      width: auto;
      visibility: hidden;
    }

    .flower__layer {
      position: absolute;
      inset: 0;
    }

    .flower__layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flower__layer--top {
      mask-image: linear-gradient(#0000, #0000);
      -webkit-mask-image: linear-gradient(#0000, #0000);
    }

    /* 6. Corner Copy */
    .support-copy {
      position: absolute;
      bottom: 4.361371dvh;
      color: #f7f7f7;
      font-size: clamp(14px, min(1.40625vw, 2.102804dvh), 27px);
      z-index: 3;
      overflow: hidden;
    }

    .support-copy--left { left: 3.177083vw; transform: scaleX(1.073); }
    .support-copy--right { left: 78.28125vw; transform: scaleX(1.058); }

    .support-copy__inner {
      display: block;
    }

    /* Entrance Animations */
    .anim .brand-mark { animation: orb-quiet 620ms var(--orb-soft) 100ms both; }
    .anim .nav-home { animation: orb-dim 550ms var(--orb-soft) 180ms both; }
    .anim .nav-resources { animation: orb-dim 550ms var(--orb-soft) 225ms both; }
    .anim .nav-benefits { animation: orb-dim 550ms var(--orb-soft) 270ms both; }
    .anim .nav-contact { animation: orb-dim 550ms var(--orb-soft) 315ms both; }
    .anim .secure-pill { animation: orb-quiet 620ms var(--orb-soft) 340ms both; }
    .anim .orbit-word__inner { animation: orb-word 1150ms var(--orb-reveal) 300ms both; }
    .anim .flower { animation: orb-subject 1150ms var(--orb-reveal) 660ms both; }
    .anim .support-copy__inner { animation: orb-corner 720ms var(--orb-soft) 980ms both; }

    @keyframes orb-word {
      from { transform: translateY(118%); }
      to { transform: translateY(0); }
    }

    @keyframes orb-subject {
      from { opacity: 0; transform: translateX(-50%) translateY(3.4dvh); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes orb-corner {
      from { opacity: 0; transform: translateY(1em); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes orb-quiet {
      from { opacity: 0; transform: translateY(0.5em); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes orb-dim {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .anim * {
        animation: none !important;
      }
      html.anim {
        animation: orb-dim 280ms ease-out both;
      }
    }

    /* Mobile Chrome */
    .mobile-chrome { display: none; }
    
    @media (max-width: 900px), (max-aspect-ratio: 4/5) {
      .primary-nav, .secure-pill { display: none; }
      .mobile-chrome { display: block; }
      
      .burger {
        position: absolute;
        top: 2.336449dvh;
        right: 4vw;
        width: 48px;
        height: 48px;
        background: var(--ink);
        border-radius: 50%;
        z-index: 12;
        border: none;
        cursor: pointer;
      }
      
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(22, 22, 22, 0.8);
        z-index: 9;
        display: none;
        backdrop-filter: blur(4px);
      }
      
      .sheet {
        position: fixed;
        top: 10dvh;
        left: 4vw;
        right: 4vw;
        background: var(--ink);
        color: var(--surface);
        border-radius: 24px;
        padding: 24px;
        z-index: 10;
        display: none;
      }

      body.menu-open .scrim, body.menu-open .sheet {
        display: block;
      }

      .flower {
        height: min(55dvh, 110vw);
      }

      .orbit-word {
        font-size: min(27.5vw, 18dvh);
      }
    }

    @media (max-width: 1200px), (orientation: portrait) {
      .orbit-word {
        left: 0;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main class="viewport">
    <section class="stage">
      
      <svg class="brand-mark" viewBox="0 0 66 62" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M33 1 L33 61 M3 31 L63 31 M11.8 9.8 L54.2 52.2 M54.2 9.8 L11.8 52.2" stroke="white" stroke-width="5" stroke-linecap="square"/>
      </svg>

      <ul class="primary-nav">
        <li class="nav-home"><a href="#home">Home</a></li>
        <li class="nav-resources"><a href="#resources">Resources</a></li>
        <li class="nav-benefits"><a href="#benefits">Benefits</a></li>
        <li class="nav-contact"><a href="#contact">Contact</a></li>
      </ul>

      <a href="#" class="secure-pill">Secure system</a>

      <div class="mobile-chrome">
        <button class="burger" aria-label="Menu"></button>
        <div class="scrim"></div>
        <div class="sheet">
          <ul style="font-size: 24px; display: flex; flex-direction: column; gap: 16px;">
            <li><a href="#home">Home</a></li>
            <li><a href="#resources">Resources</a></li>
            <li><a href="#benefits">Benefits</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </div>
      </div>

      <h1 class="orbit-word" id="orbit-title" aria-label="Orbit">
        <span class="orbit-word__mask">
          <span class="orbit-word__inner">
            <span class="orbit-word__white"><span class="orbit-word__o">O</span>R</span>
            <span class="orbit-word__pink">BIT</span>
          </span>
        </span>
      </h1>

      <div class="flower">
        <!-- SVG Data URI placeholders for the brain/digital twin to ensure single file delivery -->
        <img class="flower__sizer" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cpath d='M200 50 C100 50 50 150 50 200 C50 250 100 300 150 350 L250 350 C300 300 350 250 350 200 C350 150 300 50 200 50 Z' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M100 150 Q150 100 200 150 T300 150' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M120 200 Q150 180 200 250 T280 200' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" alt="" aria-hidden="true">
        
        <div class="flower__layer flower__layer--bg">
          <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cpath d='M200 50 C100 50 50 150 50 200 C50 250 100 300 150 350 L250 350 C300 300 350 250 350 200 C350 150 300 50 200 50 Z' fill='none' stroke='%23666' stroke-width='8'/%3E%3Cpath d='M100 150 Q150 100 200 150 T300 150' fill='none' stroke='%23666' stroke-width='4'/%3E%3Cpath d='M120 200 Q150 180 200 250 T280 200' fill='none' stroke='%23666' stroke-width='4'/%3E%3C/svg%3E" alt="Pixel-art pink and violet brain">
        </div>
        
        <div class="flower__layer flower__layer--top" aria-hidden="true">
          <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffc5dc'/%3E%3Cstop offset='100%25' stop-color='%23fd86db'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M200 50 C100 50 50 150 50 200 C50 250 100 300 150 350 L250 350 C300 300 350 250 350 200 C350 150 300 50 200 50 Z' fill='none' stroke='url(%23grad)' stroke-width='16'/%3E%3Cpath d='M100 150 Q150 100 200 150 T300 150' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Cpath d='M120 200 Q150 180 200 250 T280 200' fill='none' stroke='%23fd86db' stroke-width='8'/%3E%3Ccircle cx='200' cy='150' r='10' fill='%23fff'/%3E%3Ccircle cx='150' cy='220' r='8' fill='%23ffc5dc'/%3E%3Ccircle cx='250' cy='210' r='12' fill='%23fd86db'/%3E%3C/svg%3E" alt="">
        </div>
      </div>

      <div class="support-copy support-copy--left">
        <span class="support-copy__inner">Every workflow,<br>intelligently connected.</span>
      </div>
      <div class="support-copy support-copy--right">
        <span class="support-copy__inner">Less manual work.<br>More meaningful output.</span>
      </div>

    </section>
  </main>

  <script>
    // Remove .anim safely after load
    setTimeout(() => {
      document.documentElement.classList.remove('anim');
    }, 6000);

    // Mobile Menu
    const burger = document.querySelector('.burger');
    const scrim = document.querySelector('.scrim');
    let menuOpen = false;

    if (burger) {
      burger.addEventListener('click', () => {
        menuOpen = !menuOpen;
        document.body.classList.toggle('menu-open', menuOpen);
      });
      scrim.addEventListener('click', () => {
        menuOpen = false;
        document.body.classList.remove('menu-open');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuOpen) {
          menuOpen = false;
          document.body.classList.remove('menu-open');
        }
      });
    }

    // Canvas Morph Trail
    const stage = document.querySelector('.stage');
    const flower = document.querySelector('.flower');
    const layerBg = document.querySelector('.flower__layer--bg');
    const layerTop = document.querySelector('.flower__layer--top');
    
    const cFront = document.createElement('canvas');
    const ctxFront = cFront.getContext('2d');
    const cReveal = document.createElement('canvas');
    const ctxReveal = cReveal.getContext('2d');

    const TRAIL_MAX_POINTS = 60;
    const TRAIL_NOISE_AMP = 44;
    const TRAIL_FADE_SPEED = 0.92;
    const TRAIL_SAMPLE_DIST = 8;

    let targetR = 0;
    let headRadius = 0;
    let hovering = false;
    let points = [];
    let time = 0;
    let lastX = -999, lastY = -999;

    function resize() {
      const rect = flower.getBoundingClientRect();
      if(rect.width === 0) return;
      cFront.width = rect.width;
      cFront.height = rect.height;
      cReveal.width = rect.width;
      cReveal.height = rect.height;
    }
    
    window.addEventListener('resize', resize);
    // Initial size after DOM flush
    requestAnimationFrame(resize);
    setTimeout(resize, 100);

    stage.addEventListener('mouseenter', () => hovering = true);
    stage.addEventListener('mouseleave', () => hovering = false);
    stage.addEventListener('mousemove', (e) => {
      hovering = true;
      const rect = flower.getBoundingClientRect();
      if(rect.width === 0) return;
      
      // Calculate coordinates relative to .flower dimensions
      const scaleX = cFront.width / rect.width;
      const scaleY = cFront.height / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;
      
      const dist = Math.hypot(cx - lastX, cy - lastY);
      if (headRadius > 5 && dist > TRAIL_SAMPLE_DIST) {
        points.push({ x: cx, y: cy, r: headRadius, alpha: 1, seed: Math.random() * 100 });
        lastX = cx;
        lastY = cy;
        if (points.length > TRAIL_MAX_POINTS) {
          points.shift();
        }
      }
    });

    function drawBlob(ctx, cx, cy, r, t, seed) {
      if (r < 2) return;
      ctx.beginPath();
      const pts = [];
      for (let i = 0; i < 24; i++) {
        const angle = (i / 24) * Math.PI * 2;
        const n1 = Math.sin(angle * 3 + t * 1.4 + seed) * 0.45;
        const n2 = Math.sin(angle * 5 - t * 0.9 + seed * 2.3) * 0.3;
        const n3 = Math.cos(angle * 2 + t * 1.8 + seed * 0.7) * 0.25;
        const noise = (n1 + n2 + n3) * TRAIL_NOISE_AMP * (r / 140);
        const radius = r + noise;
        pts.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius });
      }
      
      ctx.moveTo((pts[0].x + pts[pts.length - 1].x) / 2, (pts[0].y + pts[pts.length - 1].y) / 2);
      for (let i = 0; i < pts.length; i++) {
        const next = pts[(i + 1) % pts.length];
        const mx = (pts[i].x + next.x) / 2;
        const my = (pts[i].y + next.y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
      }
      ctx.fill();
    }

    function render() {
      targetR = hovering ? 140 : 0;
      headRadius += (targetR - headRadius) * (hovering ? 0.14 : 0.04);
      time += 0.016;

      if(cFront.width > 0 && points.length > 0) {
        // Front Canvas: Fill white, punch out blobs
        ctxFront.globalCompositeOperation = 'source-over';
        ctxFront.fillStyle = 'white';
        ctxFront.fillRect(0, 0, cFront.width, cFront.height);
        
        ctxFront.globalCompositeOperation = 'destination-out';
        ctxFront.fillStyle = 'white';

        // Reveal Canvas: Clear, draw blobs
        ctxReveal.clearRect(0, 0, cReveal.width, cReveal.height);
        ctxReveal.globalCompositeOperation = 'source-over';
        ctxReveal.fillStyle = 'white';

        for (let i = points.length - 1; i >= 0; i--) {
          const p = points[i];
          p.alpha *= TRAIL_FADE_SPEED;
          p.r *= 0.995;
          
          if (p.alpha < 0.01) {
            points.splice(i, 1);
            continue;
          }
          
          ctxFront.globalAlpha = p.alpha;
          drawBlob(ctxFront, p.x, p.y, p.r, time, p.seed);
          
          ctxReveal.globalAlpha = p.alpha;
          drawBlob(ctxReveal, p.x, p.y, p.r, time, p.seed);
        }

        // Apply masks
        const frontData = `url(${cFront.toDataURL()})`;
        layerBg.style.maskImage = frontData;
        layerBg.style.webkitMaskImage = frontData;
        layerBg.style.maskSize = '100% 100%';
        layerBg.style.webkitMaskSize = '100% 100%';

        const revealData = `url(${cReveal.toDataURL()})`;
        layerTop.style.maskImage = revealData;
        layerTop.style.webkitMaskImage = revealData;
        layerTop.style.maskSize = '100% 100%';
        layerTop.style.webkitMaskSize = '100% 100%';
      } else if (cFront.width > 0 && points.length === 0 && headRadius < 1) {
        // Reset masks when empty
        layerBg.style.maskImage = 'none';
        layerBg.style.webkitMaskImage = 'none';
        layerTop.style.maskImage = 'linear-gradient(#0000, #0000)';
        layerTop.style.webkitMaskImage = 'linear-gradient(#0000, #0000)';
      }

      requestAnimationFrame(render);
    }
    
    render();
  </script>
</body>
</html>
