<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../../../styles.css">
</head>
<body>
  <!-- Cinematic Background -->
  <div class="bg">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4" type="video/mp4">
    </video>
    <div class="bg-vignette"></div>
  </div>

  <div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">ALTER APP</div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-title">Engine</div>
        <a href="../../../app/overview/index.html" class="sidebar-link">Overview</a>
        <a href="../../../app/decisions/simulate-decision/index.html" class="sidebar-link">Simulate Decision</a>
        <a href="../../../app/ask-twin/index.html" class="sidebar-link">Ask Alter</a>
      </div>
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-title">Memory</div>
        <a href="../../../app/memory/semantic/index.html" class="sidebar-link">Semantic</a>
        <a href="../../../app/memory/episodic/index.html" class="sidebar-link">Episodic</a>
        <a href="../../../app/memory/behavioral/index.html" class="sidebar-link">Behavioral</a>
      </div>
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-title">System</div>
        <a href="../../../app/settings/profile/index.html" class="sidebar-link">Settings</a>
        <a href="../../../index.html" class="sidebar-link">Back to Site</a>
      </div>
    </nav>
  </aside>

    <main class="app-content">
      <h1 class="app-page-title">Episodic Memory</h1>
      <p class="app-page-sub">A chronological log of your ingested events and activities.</p>
      
      <div class="app-panel">
        <div class="app-card-title">Event Timeline (From 60-Day Dataset)</div>
        <div class="feed-list" id="episodic-feed">
          <p style="color:#aaa;">Loading dataset...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = '/api';

    async function loadEpisodicData() {
      try {
        const response = await fetch(`${API_BASE_URL}/memories/episodic`);
        if (!response.ok) throw new Error("Could not connect to Twin Engine Backend");
        
        const memories = await response.json();
        const feed = document.getElementById('episodic-feed');
        feed.innerHTML = '';
        
        if (memories.length === 0) {
            feed.innerHTML = '<p style="color:#aaa;">No episodic memories found.</p>';
            return;
        }

        memories.forEach(mem => {
          const category = mem.metadata?.category || 'General';
          const icon = category.toLowerCase().includes('academic') ? 'fa-book' : 
                       category.toLowerCase().includes('leisure') ? 'fa-gamepad' : 
                       category.toLowerCase().includes('routine') ? 'fa-clock' : 'fa-location-dot';

          const html = `
            <div class="feed-item">
              <div class="feed-icon"><i class="fa-solid ${icon}"></i></div>
              <div class="feed-content">
                <p>${mem.content}</p>
                <div class="feed-meta">${mem.metadata?.date || 'Unknown Date'} &bull; ${category}</div>
              </div>
            </div>
          `;
          feed.innerHTML += html;
        });
        
      } catch (e) {
        document.getElementById('episodic-feed').innerHTML = `
          <div style="background: rgba(255,107,107,0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(255,107,107,0.2);">
            <p style="color:#ff6b6b; margin: 0;"><strong>Backend Disconnected</strong></p>
            <p style="color:#aaa; font-size: 13px; margin-top: 4px;">Could not securely fetch memories from the Python backend. Ensure the server is running locally on port 8000.</p>
          </div>
        `;
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadEpisodicData);
  </script>
  <!-- Add FontAwesome for icons if not already present in styles.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
</body>
</html>
