<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Behavioral — Alter App</title>
  <link rel="stylesheet" href="../../../styles.css">
</head>
<body>
  <!-- Cinematic Background -->
  <div class="bg">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4" type="video/mp4">
    </video>
    <div class="bg-vignette"></div>
  </div>

  <div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">ALTER APP</div>
    <nav class="sidebar-nav">
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-title">Engine</div>
        <a href="../../../app/overview/index.html" class="sidebar-link">Overview</a>
        <a href="../../../app/decisions/simulate-decision/index.html" class="sidebar-link">Simulate Decision</a>
        <a href="../../../app/ask-twin/index.html" class="sidebar-link">Ask Alter</a>
      </div>
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-title">Memory</div>
        <a href="../../../app/memory/semantic/index.html" class="sidebar-link">Semantic</a>
        <a href="../../../app/memory/episodic/index.html" class="sidebar-link">Episodic</a>
        <a href="../../../app/memory/behavioral/index.html" class="sidebar-link">Behavioral</a>
      </div>
      <div class="sidebar-nav-group">
        <div class="sidebar-nav-title">System</div>
        <a href="../../../app/settings/profile/index.html" class="sidebar-link">Settings</a>
        <a href="../../../index.html" class="sidebar-link">Back to Site</a>
      </div>
    </nav>
  </aside>

    <main class="app-content">
      <h1 class="app-page-title">Behavioral Models</h1>
      <p class="app-page-sub">Identified patterns, habits, and physiological trends derived from your dataset.</p>
      
      <div class="app-grid" id="behavioral-stats">
        <p style="color:#aaa;">Analyzing dataset...</p>
      </div>

      <div class="app-panel" style="margin-top: 32px;">
        <div class="app-card-title">Derived Behavioral Insights</div>
        <div class="feed-list" id="behavioral-insights">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:8000/api';

    async function loadBehavioralData() {
      try {
        const response = await fetch(`${API_BASE_URL}/memories/behavioral`);
        if (!response.ok) throw new Error("Could not connect to Twin Engine Backend");
        const memories = await response.json();
        
        // In a real scenario, the backend /api/overview might return the stats.
        // For now, we will just display the fetched behavioral insights.
        
        const statsGrid = document.getElementById('behavioral-stats');
        statsGrid.innerHTML = `
          <div class="app-card">
            <div class="app-card-title">Behavioral Memories</div>
            <div class="metric-value">${memories.length}</div>
            <div class="metric-label">Patterns identified securely by backend</div>
          </div>
          <div class="app-card">
            <div class="app-card-title">Privacy Status</div>
            <div class="metric-value" style="color: #4ade80;">Secure</div>
            <div class="metric-label">Data never exposed to frontend</div>
          </div>
        `;
        
        const insights = document.getElementById('behavioral-insights');
        insights.innerHTML = '';
        
        memories.forEach(mem => {
          insights.innerHTML += `
            <div class="feed-item">
              <div class="feed-icon"><span class="badge badge-inferred">Pattern</span></div>
              <div class="feed-content">
                <p>${mem.content}</p>
                <div class="feed-meta">Confidence: ${Math.round(mem.confidence * 100)}% &bull; Computed by Twin Engine</div>
              </div>
            </div>
          `;
        });
        
        if (memories.length === 0) {
            insights.innerHTML = '<p style="color:#aaa;">No behavioral patterns extracted yet.</p>';
        }
        
      } catch (e) {
        document.getElementById('behavioral-stats').innerHTML = `
          <div style="background: rgba(255,107,107,0.1); padding: 16px; border-radius: 8px; border: 1px solid rgba(255,107,107,0.2); grid-column: 1 / -1;">
            <p style="color:#ff6b6b; margin: 0;"><strong>Backend Disconnected</strong></p>
            <p style="color:#aaa; font-size: 13px; margin-top: 4px;">Could not securely fetch memories from the Python backend. Ensure the server is running locally on port 8000.</p>
          </div>
        `;
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadBehavioralData);
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
</body>
</html>
