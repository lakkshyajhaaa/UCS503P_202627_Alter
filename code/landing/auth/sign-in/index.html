<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Alter</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    /* Minimal auth layout */
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; position: relative; z-index: 1; }
    .auth-box { background: rgba(10, 10, 10, 0.6); border: 1px solid rgba(255,255,255,0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 48px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
    .auth-title { font-size: 24px; margin-bottom: 8px; font-weight: 500; }
    .auth-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
    .auth-input { width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 12px 16px; color: #fff; font-size: 14px; margin-bottom: 16px; outline: none; transition: border-color 0.3s; }
    .auth-input:focus { border-color: rgba(255,255,255,0.3); }
    .auth-btn { width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 4px; font-weight: 500; cursor: pointer; transition: opacity 0.3s; margin-bottom: 24px; }
    .auth-btn:hover { opacity: 0.9; }
    .back-link { font-size: 13px; color: var(--muted); transition: color 0.3s; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <!-- Cinematic Background -->
  <div class="bg">
    <video class="bg-video" autoplay muted loop playsinline>
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260809_012548_ef22562c-c0ae-4816-ad9d-f8922af4e6a7.mp4" type="video/mp4">
    </video>
    <div class="bg-vignette"></div>
  </div>

  <div class="auth-page">
    <div class="auth-box">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to access your Twin.</p>
      
      <form id="sign-in-form">
        <input type="email" class="auth-input" placeholder="Email address" required value="demo@alter.com">
        <input type="password" class="auth-input" placeholder="Password" required value="password">
        <button type="submit" class="auth-btn">Sign In</button>
      </form>
      
      <a href="/" class="back-link">&larr; Back to home</a>
    </div>
  </div>

  <script>
    document.getElementById('sign-in-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // Mock setting the authenticated state
      localStorage.setItem('alter_signed_in', 'true');
      
      // Redirect to onboarding/app automatically
      window.location.href = '/onboarding/';
    });
  </script>
</body>
</html>
